// app/build.gradle
// ─────────────────────────────────────────────────────────────────────────────
// OFFLINE REFACTOR — dependency notes
//
// 1. ML Kit Text Recognition (on-device OCR)
//    Google Play Services bundled model — runs fully on-device, no network
//    call, no API key. Used by OcrHelper.java to extract raw text from a
//    scanned report image. Output is handed to ReportParser.java, which
//    converts raw text into structured test items (name + value + unit).
//
// 2. No BuildConfig / API key required anymore.
//    local.properties at build time. The app no longer calls any remote
//    AI service, so buildConfigField and the Properties-reading block
//    have been removed entirely.
//
// 3. These were only required as transitive runtime dependencies of the
//    none of them are needed — the app is pure Java again.
// ─────────────────────────────────────────────────────────────────────────────

plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mannan.medimind'
    compileSdk 36

    defaultConfig {
        applicationId "com.mannan.medimind"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export path (required for explicit Migration validation)
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // ProGuard keep rules needed for release — see proguard-rules.pro:
            //   -keep class com.google.gson.**        { *; }
            //   -keep class com.mannan.medimind.db.** { *; }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // AndroidX Core (WindowInsetsControllerCompat)
    implementation 'androidx.core:core:1.13.1'

    // Lifecycle runtime (OnBackPressedCallback)
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.3'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Navigation Component
    def nav_version = "2.8.3"
    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    // Room Database (offline history storage)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Gson (JSON serialisation for AnalysisResult)
    implementation 'com.google.code.gson:gson:2.11.0'

    // ── ML Kit Text Recognition (on-device OCR) ───────────────────────────
    // Extracts raw text from a scanned report image, fully offline.
    // Used by OcrHelper.java; output feeds into ReportParser.java.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'

    // ── AndroidX ExifInterface ─────────────────────────────────────────────
    // Reads EXIF rotation directly from a content:// Uri InputStream so
    // camera photos are corrected to upright before OCR (more reliable
    // across devices than the platform's android.media.ExifInterface).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // MPAndroidChart (grouped bar chart in CompareFragment)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Lifecycle ViewModel + LiveData
    def lifecycle_version = "2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
}